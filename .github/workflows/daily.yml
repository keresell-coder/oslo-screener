name: Daily Screener

on:
  schedule:
    - cron: "15 16 * * 1-5"  # after the completed Oslo session in CET and CEST
    - cron: "15 6 * * 1-5"   # 06:15 UTC = ca. 08:15 Oslo (CEST) / 07:15 Oslo (CET)
  workflow_dispatch:

concurrency:
  group: daily-screener-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      data_status: ${{ steps.health.outputs.status }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-dev.txt

      - name: Regression tests
        run: python -m pytest -q

      - name: Run screener
        env:
          YF_PAUSE: "0.40"
        run: python screener.py

      - name: Build daily report
        run: python scripts/build_report.py

      - name: Verify complete snapshot bundle
        id: health
        run: |
          python scripts/validate_snapshot.py --require-report --allow-blocked
          python - <<'PYCODE'
          import json, os
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("status=" + json.load(open("health.json"))["status"] + "\n")
          PYCODE

      - name: Commit latest.csv and reports to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json latest.csv summaries/*.md buy.csv sell.csv watch_buy.csv watch_sell.csv signals_only.csv
          git commit -m "daily: latest.csv + dagsrapport [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screener-and-summary
          path: |
            health.json
            latest.csv
            summaries/*.md
            report_*.csv

      - name: Prepare site content
        run: |
          python - <<'PYCODE'
          import json, shutil
          from pathlib import Path
          health = json.loads(Path("health.json").read_text())
          Path("site").mkdir(exist_ok=True)
          for name in ["health.json", *health["artifacts"]]:
              dest = Path("site") / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, dest)
          Path("site/index.html").write_text('<!doctype html><html lang="en"><meta charset="utf-8"><title>Oslo Screener data</title><h1>Oslo Screener</h1><p>Source health: ' + health["status"] + '</p><p><a href="health.json">Observation dates, coverage and health</a> · <a href="latest.csv">CSV snapshot</a></p></html>')
          PYCODE

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger dashboard refresh when token is configured
        env:
          DASHBOARD_WORKFLOW_TOKEN: ${{ secrets.DASHBOARD_WORKFLOW_TOKEN }}
        run: |
          if [ -z "${DASHBOARD_WORKFLOW_TOKEN:-}" ]; then
            echo "DASHBOARD_WORKFLOW_TOKEN is not configured; dashboard will refresh on its schedule."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DASHBOARD_WORKFLOW_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/keresell-coder/oslo-screener-dashboard/actions/workflows/daily.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Fail run when source health is blocked
        if: needs.run.outputs.data_status == 'blocked'
        run: |
          echo "Published a safe blocked snapshot. No actionable output; source coverage needs attention."
          exit 1
