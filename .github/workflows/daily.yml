name: Daily Screener

on:
  push:
    branches: [main]
    paths:
      - 'screener.py'
      - 'yahoo_history.py'
      - 'market_health.py'
      - 'config.yaml'
      - 'universe.yaml'
      - 'tickers.txt'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: "37 19 * * 1-5"  # 20:37 CET / 21:37 CEST, allow Yahoo to finalize EOD
    - cron: "37 23 * * 1-5"  # overnight retry for the same completed session
    - cron: "37 3 * * 2-6"   # 04:37 CET / 05:37 CEST, well before next open
  workflow_dispatch:

concurrency:
  group: daily-screener-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      data_status: ${{ steps.health.outputs.status }}
      snapshot_id: ${{ steps.health.outputs.snapshot_id }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node for reader status regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-dev.txt

      - name: Regression tests
        run: python -m pytest -q

      - name: Run screener
        env:
          YF_PAUSE: "0.60"
        run: python screener.py

      - name: Build daily report
        run: python scripts/build_report.py

      - name: Prepare identical branch and artifact Pages bundles
        run: python scripts/prepare_publication.py

      - name: Verify complete snapshot bundle
        id: health
        run: |
          python scripts/validate_snapshot.py --require-report --allow-blocked
          python scripts/prepare_publication.py --verify
          python - <<'PYCODE'
          import json, os
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              health = json.load(open("health.json"))
              output.write("status=" + health["status"] + "\n")
              output.write("snapshot_id=" + health["snapshot_id"] + "\n")
          PYCODE

      - name: Commit the complete declared publication bundle to main
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/prepare_publication.py --stage
          if ! git diff --cached --quiet; then
            git commit -m "daily: complete screener publication [skip ci]"
          fi
          git pull --rebase --autostash origin main
          python scripts/prepare_publication.py --verify
          git push origin HEAD:main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-and-summary
          path: site
          include-hidden-files: true

      - name: Upload fetch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-fetch-diagnostics
          path: fetch_diagnostics.json

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout refresh verifier
        uses: actions/checkout@v4

      - name: Setup Python for refresh verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install refresh verifier dependency
        run: python -m pip install requests==2.32.5

      - name: Refresh dashboard and verify public snapshot
        env:
          DASHBOARD_WORKFLOW_TOKEN: ${{ secrets.DASHBOARD_WORKFLOW_TOKEN }}
          PRODUCER_SNAPSHOT_ID: ${{ needs.run.outputs.snapshot_id }}
        run: python scripts/refresh_dashboard.py --snapshot-id "$PRODUCER_SNAPSHOT_ID"

      - name: Fail run when source health is blocked
        if: needs.run.outputs.data_status == 'blocked'
        run: |
          echo "Published a safe blocked snapshot. No actionable output; source coverage needs attention."
          exit 1
