name: Weekly Universe Sync and Ticker Validation

on:
  schedule:
    # Kjør søndag 05:20 UTC (≈ 06:20 CET / 07:20 CEST) – før første screener-kjøring mandag
    - cron: "20 5 * * 0"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Overstyr sikkerhetsgrensene i sync_universe.py (FORCE_SYNC=1)"
        type: boolean
        default: false
      allow_shrink:
        description: "Godta at valid_tickers.txt krymper mer enn terskelen"
        type: boolean
        default: false

concurrency:
  group: weekly-ticker-validation-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync universe from Euronext
        env:
          FORCE_SYNC: ${{ inputs.force_sync && '1' || '0' }}
        run: python sync_universe.py

      - name: Run validator
        env:
          YF_PAUSE: "0.40"
          ALLOW_TICKER_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: |
          echo "YF_PAUSE=$YF_PAUSE"
          python validate_tickers.py

      - name: Commit universe and validated tickers
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          git add tickers.txt valid_tickers.txt invalid_tickers.csv
          if git diff --cached --quiet; then
            echo "No ticker changes to commit"
            exit 0
          fi

          git commit -m "weekly: synk univers + oppdater validerte tickers [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-validation
          path: |
            tickers.txt
            valid_tickers.txt
            invalid_tickers.csv
