name: Daily Screener

on:
  schedule:
    - cron: "37 19 * * 1-5"  # 20:37 CET / 21:37 CEST; allow EOD data to settle
    - cron: "37 23 * * 1-5"  # overnight retry for the same completed session
    - cron: "37 3 * * 2-6"   # 04:37 CET / 05:37 CEST; leave room for scheduler delays
  workflow_dispatch:

concurrency:
  group: daily-screener-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      data_status: ${{ steps.health.outputs.status }}
      publish: ${{ steps.publication.outputs.publish }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node for reader status regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-dev.txt

      - name: Regression tests
        run: python -m pytest -q

      - name: Capture the committed report before fetching
        run: python scripts/publication_policy.py --capture "$RUNNER_TEMP/published-snapshot"

      - name: Run screener
        env:
          YF_PAUSE: "0.40"
        run: python screener.py

      - name: Build daily report
        run: python scripts/build_report.py

      - name: Prepare identical branch and artifact Pages bundles
        run: python scripts/prepare_publication.py

      - name: Verify complete snapshot bundle
        id: health
        run: |
          python scripts/validate_snapshot.py --require-report --allow-blocked
          python scripts/prepare_publication.py --verify
          python - <<'PYCODE'
          import json, os
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("status=" + json.load(open("health.json"))["status"] + "\n")
          PYCODE

      - name: Decide whether this attempt improves the published report
        id: publication
        run: python scripts/publication_policy.py --published "$RUNNER_TEMP/published-snapshot"

      - name: Commit the complete declared publication bundle to main
        if: github.ref == 'refs/heads/main' && steps.publication.outputs.publish == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/prepare_publication.py --stage
          if ! git diff --cached --quiet; then
            git commit -m "daily: complete screener publication [skip ci]"
          fi
          # If main moved during the fetch, fail the non-forced push. Do not
          # combine a report with changed code or overwrite a newer report.
          python scripts/prepare_publication.py --verify
          git push origin HEAD:main

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-and-summary
          path: site
          include-hidden-files: true

      - name: Upload publication decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-decision
          path: publication-decision.json

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && steps.publication.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.run.outputs.publish == 'true'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger dashboard refresh when token is configured
        env:
          DASHBOARD_WORKFLOW_TOKEN: ${{ secrets.DASHBOARD_WORKFLOW_TOKEN }}
        run: |
          if [ -z "${DASHBOARD_WORKFLOW_TOKEN:-}" ]; then
            echo "DASHBOARD_WORKFLOW_TOKEN is not configured; dashboard will refresh on its schedule."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DASHBOARD_WORKFLOW_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/keresell-coder/oslo-screener-dashboard/actions/workflows/daily.yml/dispatches \
            -d '{"ref":"main"}'

  source-health:
    needs: run
    if: needs.run.outputs.data_status == 'blocked'
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed data attempt even when an earlier report was retained
        run: |
          echo "This fetch is blocked. See the publication-decision artifact for whether the previous report was retained."
          exit 1
